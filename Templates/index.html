<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOJO SMS</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    
    body {
        background: #000000; /* Deep Black */
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }
    
    .container {
        background: #0A1128; /* Dark Blue */
        padding: 40px 30px;
        border-radius: 16px;
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.2); /* Yellow glow */
        width: 100%;
        max-width: 420px;
        border: 1px solid #1C2E4A;
    }
    
    h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #FFD700; /* Bright Yellow */
        font-size: 28px;
        letter-spacing: 1px;
    }
    
    input, textarea {
        width: 100%;
        padding: 14px;
        margin-bottom: 18px;
        background: #000;
        border: 1px solid #1C2E4A;
        border-radius: 8px;
        color: #fff;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
    }
    
    input:focus, textarea:focus {
        border-color: #FFD700;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }
    
    button {
        width: 100%;
        padding: 15px;
        background: #FFD700; /* Bright Yellow */
        color: #000;
        font-weight: bold;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    }
    
    button:hover {
        background: #FFC300;
        transform: translateY(-2px);
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
    }
    
    .msg {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>KOJO SMS</h1>
        <form method="POST" action="/send">
            <input type="text" name="to" placeholder="+234 XXX XXX XXXX" required>
            <textarea name="message" rows="4" placeholder="Type your message..." required></textarea>
            <button type="submit">SEND SMS</button>
        </form>
        {% if msg %}<p class="msg">{{ msg }}</p>{% endif %}
    </div>
</body>
</html>
