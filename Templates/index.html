<!DOCTYPE html>
<html>
<head>
    <title>Kojo SMS App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; padding: 20px; background: #f4f4f4; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        input, textarea, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #25D366; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background: #128C7E; }
        #result { margin-top: 15px; padding: 10px; border-radius: 5px; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📱 Kojo SMS Sender</h2>
        <form id="smsForm">
            <label>Phone Numbers</label>
            <input type="text" id="number" placeholder="+2348012345678, +2348098765432" required>
            <small>Separate multiple numbers with comma</small>
            
            <label>Message</label>
            <textarea id="message" rows="4" placeholder="Type your message here..." required></textarea>
            
            <button type="submit">Send SMS</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('smsForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const number = document.getElementById('number').value;
            const message = document.getElementById('message').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.style.display = 'block';
            resultDiv.className = '';
            resultDiv.innerText = 'Sending...';
            
            const formData = new FormData();
            formData.append('number', number);
            formData.append('message', message);
            
            const response = await fetch('/send_sms', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            if(data.status === 'success') {
                resultDiv.className = 'success';
            } else {
                resultDiv.className = 'error';
            }
            resultDiv.innerText = data.message;
        });
    </script>
</body>
</html>
