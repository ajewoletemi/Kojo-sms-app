<!DOCTYPE html>
<html>
<head><title>KOJO Signup</title><style>body{font-family:sans-serif;padding:40px;background:#f4f4f4}form{background:white;padding:20px;border-radius:8px;max-width:400px;margin:auto}</style></head>
<body>
<h2>KOJO - Create Account</h2>
<form method="POST">
  <input name="email" type="email" placeholder="Email" required style="width:100%;padding:10px;margin:10px 0"><br>
  <input name="password" type="password" placeholder="Password" required style="width:100%;padding:10px;margin:10px 0"><br>
  <button type="submit" style="width:100%;padding:10px;background:#28a745;color:white;border:none">Signup</button>
</form>
<p>Already get account? <a href="/login">Login</a></p>
</body>
</html>
