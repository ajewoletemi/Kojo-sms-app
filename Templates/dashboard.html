<!DOCTYPE html>
<html>
<head><title>KOJO Dashboard</title><style>body{font-family:sans-serif;padding:20px}.card{background:white;padding:20px;margin:10px 0;border-radius:8px;box-shadow:0 2px 4px #ccc}</style></head>
<body>
<h2>KOJO Dashboard</h2>
<a href="/logout">Logout</a>
<div class="card">
  <h3>Wallet Balance: ₦{{ balance }}</h3>
  <button>Fund with Paystack</button>
  <button>Fund with Bitcoin</button>
  <p><small>Send proof of BTC payment to admin to credit</small></p>
</div>

<div class="card">
  <h3>Buy Number - $5/Month</h3>
  <form method="POST" action="/buy-number">
    <select name="country" required>
      <option value="US">USA</option>
      <option value="NG">Nigeria</option>
      <option value="GB">UK</option>
      <option value="CA">Canada</option>
    </select>
    <button type="submit">Buy Number</button>
  </form>
  <h4>Your Numbers:</h4>
  {% for num in numbers %}
    <p>{{ num.phone_number }} - {{ num.country }}</p>
  {% endfor %}
</div>
<a href="/">Go to Bulk Send</a>
</body>
</html>
