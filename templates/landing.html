<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KOJO SMS - Buy Virtual Numbers & Send SMS Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0D0B1E 0%, #1A1733 50%, #2A2744 100%); 
            color: #e0e0e0; 
            font-family: 'Segoe UI', sans-serif; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 700px;
        }
        .logo {
            font-size: 72px;
            font-weight: 900;
            color: #FFD700;
            margin-bottom: 10px;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .subtitle {
            font-size: 18px;
            color: #A0A0C0;
            margin-bottom: 40px;
            font-weight: 500;
        }
        .welcome {
            font-size: 36px;
            font-weight: 800;
            color: #FFD700;
            margin-bottom: 15px;
        }
        .tagline {
            font-size: 20px;
            color: #e0e0e0;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            background: #FFD700;
            color: #000;
            padding: 18px 45px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 900;
            font-size: 18px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
        }
        .footer {
            margin-top: 60px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">KOJO SMS</div>
        <div class="subtitle">Buy Virtual Numbers & Receive SMS Online</div>
        
        <div class="welcome">Welcome</div>
        <div class="tagline">Get numbers from 20+ countries instantly</div>
        
        <div class="btn-group">
            <a href="{{ url_for('signup') }}" class="btn">Get Started</a>
            <a href="{{ url_for('login') }}" class="btn">Login</a>
        </div>
        
        <div class="footer">KOJO SMS. All rights reserved.</div>
    </div>
</body>
</html>
