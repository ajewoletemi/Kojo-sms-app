<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Kojo SMS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh; display: flex; justify-content: center; align-items: center;
        }
       .container {
            background: white; padding: 40px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 400px;
        }
        h2 { text-align: center; color: #667eea; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; }
        input:focus { border-color: #667eea; outline: none; }
        button {
            width: 100%; padding: 12px; background: #667eea; color: white;
            border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px;
        }
        button:hover { background: #764ba2; }
       .flash { padding: 12px; margin-bottom: 15px; border-radius: 8px; }
      .success { background: #d4edda; color: #155724; }
      .danger { background: #f8d7da; color: #721c24; }
        p { text-align: center; margin-top: 15px; }
        a { color: #667eea; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create Account</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}{% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}{% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</body>
</html>
