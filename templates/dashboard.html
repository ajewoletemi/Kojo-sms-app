<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOJO Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body style="background: #f4f7f9;">
    <div class="dashboard-box">
        <h2>Welcome to KOJO Dashboard</h2>
        <p>Balance: <b>₦{{ "%.2f"|format(balance) }}</b></p>
        
        <div class="card">
            <h3>Fund Wallet</h3>
            <p>Pay with Paystack to fund your account</p>
            <a href="{{ url_for('fund_wallet') }}"><button>Fund Now</button></a>
        </div>

        <div class="card">
            <h3>Buy Virtual Number</h3>
            <p>Get a number to receive SMS - $5</p>
            <a href="{{ url_for('buy_number') }}"><button>Buy Number</button></a>
        </div>
        
        <a href="{{ url_for('logout') }}" style="display:block; margin-top:20px;">Logout</a>
    </div>
</body>
</html>
