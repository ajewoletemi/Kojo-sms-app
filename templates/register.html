{% extends "base.html" %}
{% block title %}Sign Up - KOJO SMS{% endblock %}
{% block content %}
<div style="padding-top:30px;">
    <div class="card">
        <div class="logo" style="text-align:center; margin-bottom:8px;">KOJO SMS</div>
        <p class="muted" style="text-align:center; margin-bottom:24px;">Create your account</p>

        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit" class="btn">Create Account</button>
        </form>

        <p class="muted" style="text-align:center; margin-top:20px;">
            Already have an account? <a href="{{ url_for('login') }}">Login</a>
        </p>
    </div>
</div>
{% endblock %}
