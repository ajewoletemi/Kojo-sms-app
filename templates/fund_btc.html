<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fund with BTC - Kojo</title>
    <style>
        body { background: #0D0B1E; color: #e0e0e0; font-family: Segoe UI; padding: 30px; text-align: center; }
       .card { background: #1A1733; padding: 30px; border-radius: 16px; max-width: 500px; margin: 50px auto; border: 1px solid #FFD700; }
        h2 { color: #FFD700; margin-bottom: 20px; }
       .address { background: #0D0B1E; padding: 15px; border-radius: 10px; margin: 20px 0; word-break: break-all; border: 1px dashed #FFD700; }
        a { color: #FFD700; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Fund with Bitcoin</h2>
        <p>Send BTC to the address below</p>
        <div class="address">{{ btc_address }}</div>
        <p>Send $10 worth of BTC. Wallet will be credited after 1 confirmation.</p>
        <a href="{{ url_for('user_app') }}">← Back to Dashboard</a>
    </div>
</body>
</html>
