{% extends "base.html" %}
{% block content %}
<div class="card mb-4" style="background: #FFD700; color: #000; border: none;">
  <div class="card-body">
    <p class="mb-1 fw-bold">WALLET BALANCE</p>
    <h1 class="display-4 fw-bold">${{ "%.2f"|format(wallet) }}</h1>
    <div class="d-grid gap-2">
      <a href="/fund_wallet" class="btn btn-dark btn-lg">Fund with Card</a>
      <a href="/fund_btc" class="btn btn-dark btn-lg">Fund with BTC</a>
    </div>
  </div>
</div>
<div class="card mb-3">
  <div class="card-body">
    <h4 class="kojo-yellow">Buy Virtual Number</h4>
    <p>Get a virtual number to receive SMS Instantly - $5</p>
    <button class="btn btn-warning" disabled>Coming Soon</button>
  </div>
</div>
<div class="card mb-3">
  <div class="card-body">
    <h4 class="kojo-yellow">Send SMS</h4>
    <p>Compose and send messages to any number. Cost: <b>$0.20 per SMS</b></p>
    <a href="/send_sms" class="btn btn-warning">Send SMS</a>
  </div>
</div>
{% endblock %}
