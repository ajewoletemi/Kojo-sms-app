<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kojo SMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  
  <style>
    :root {
      --kojo-yellow: #FFD700;
      --kojo-dark: #0a0a0a;
      --kojo-card: #1a1a1a;
    }
    body {
      background-color: var(--kojo-dark);
      color: #e0e0e0;
    }
    .navbar {
      background-color: #000 !important;
      border-bottom: 2px solid var(--kojo-yellow);
    }
    .navbar-brand {
      color: var(--kojo-yellow) !important;
      text-shadow: 0 0 10px var(--kojo-yellow);
    }
    .nav-link:hover {
      color: var(--kojo-yellow) !important;
    }
    .card {
      background-color: var(--kojo-card);
      border: 1px solid #333;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
    }
    .btn-primary {
      background-color: var(--kojo-yellow);
      border-color: var(--kojo-yellow);
      color: #000;
      font-weight: bold;
    }
    .btn-primary:hover {
      background-color: #ffea00;
      border-color: #ffea00;
      box-shadow: 0 0 15px var(--kojo-yellow);
    }
    .btn-success {
      background-color: #28a745;
      border-color: #28a745;
    }
    .form-control, .form-control:focus {
      background-color: #222;
      border-color: #444;
      color: #fff;
    }
    .form-control:focus {
      border-color: var(--kojo-yellow);
      box-shadow: 0 0 0 0.25rem rgba(255, 215, 0, 0.25);
    }
    .alert-success {
      background-color: rgba(40, 167, 69, 0.2);
      border-color: #28a745;
      color: #d4edda;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/user_app">Kojo SMS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/send_sms">Send SMS</a>
        <a class="nav-link" href="/fund_wallet">Fund Wallet</a>
        <a class="nav-link" href="/logout">Logout</a>
      </div>
    </div>
  </div>
</nav>

<main class="container mt-4 mb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
