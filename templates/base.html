<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KOJO SMS{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        :root {
            --bg: #0d0d0d;
            --card: #1a1a1a;
            --yellow: #ffcc00;
            --yellow-dark: #e6b800;
            --text: #ffffff;
            --muted: #aaaaaa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            line-height: 1.5;
        }
        .container { max-width: 480px; margin: 0 auto; padding: 16px; }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #2a2a2a;
        }
        .yellow-card {
            background: linear-gradient(135deg, #ffcc00, #e6b800);
            color: #000;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .btn {
            display: inline-block;
            background: var(--yellow);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            text-align: center;
            width: 100%;
            font-size: 15px;
        }
        .btn:hover { background: var(--yellow-dark); }
        .btn-dark {
            background: #000;
            color: var(--yellow);
            border: 1px solid var(--yellow);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--yellow);
            color: var(--yellow);
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            margin-bottom: 12px;
            font-size: 15px;
        }
        label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 14px; }
        .flash {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .flash.success { background: #0a3d0a; color: #8f8; }
        .flash.danger { background: #3d0a0a; color: #f88; }
        .flash.info { background: #0a2a3d; color: #8cf; }
        .flash.warning { background: #3d3a0a; color: #ff8; }
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            margin-bottom: 20px;
        }
        .logo { font-size: 22px; font-weight: 800; color: var(--yellow); }
        .balance-badge {
            background: #222;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            color: #8f8;
        }
        a { color: var(--yellow); text-decoration: none; }
        .muted { color: var(--muted); font-size: 13px; }
        h1, h2, h3 { margin-bottom: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
