<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kojo SMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --kojo-yellow: #FFD700; --kojo-dark: #0a0a1a; --kojo-card: #13132b; }
    body { background: linear-gradient(180deg, var(--kojo-dark) 0%, #000 100%); color: #fff; }
    .navbar { background: #000 !important; border-bottom: 2px solid var(--kojo-yellow); }
    .navbar-brand { color: var(--kojo-yellow) !important; text-shadow: 0 0 10px var(--kojo-yellow); font-weight: bold; }
    .kojo-yellow { color: var(--kojo-yellow); }
    .card { background: var(--kojo-card); border: 1px solid #2a2a4a; }
    .btn-warning { background: var(--kojo-yellow); border: none; color: #000; font-weight: bold; }
    .btn-warning:hover { background: #ffea00; box-shadow: 0 0 20px var(--kojo-yellow); color: #000; }
    .form-control { background: #1e1e3a; border: 1px solid #3a3a5a; color: #fff; }
    .form-control:focus { background: #1e1e3a; border-color: var(--kojo-yellow); box-shadow: 0 0 0 0.25rem rgba(255,215,0,.25); color: #fff; }
    .alert-success { background: rgba(40,167,69,.2); border-color: #28a745; color: #d4edda; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="/user_app">Kojo SMS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/send_sms">Send SMS</a>
        <a class="nav-link" href="/fund_wallet">Fund Wallet</a>
        <a class="nav-link" href="/logout">Logout</a>
      </div>
    </div>
  </div>
</nav>
<main class="container mt-4 mb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    {% endfor %}{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
