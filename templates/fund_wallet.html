{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-success text-white">
        <h3 class="mb-0">Fund Wallet</h3>
      </div>
      <div class="card-body p-4">
        
        <div class="alert alert-info" role="alert">
          <h4 class="alert-heading">Current Balance</h4>
          <p class="display-5 fw-bold mb-0">$0.00</p>
        </div>

        <h5 class="mt-4 mb-3">Top Up Amount</h5>
        <div class="row g-3 mb-4">
          <div class="col-6 col-md-3">
            <button class="btn btn-outline-primary w-100">$5</button>
          </div>
          <div class="col-6 col-md-3">
            <button class="btn btn-outline-primary w-100">$10</button>
          </div>
          <div class="col-6 col-md-3">
            <button class="btn btn-outline-primary w-100">$20</button>
          </div>
          <div class="col-6 col-md-3">
            <button class="btn btn-outline-primary w-100">$50</button>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Or Enter Custom Amount</label>
          <input type="number" class="form-control form-control-lg" placeholder="Enter amount in USD">
        </div>

        <div class="d-grid mt-4">
          <button class="btn btn-success btn-lg" disabled>
            Pay with Paystack - Coming Soon
          </button>
        </div>
        
        <p class="text-center text-muted mt-3">
          <small>Secure payments powered by Paystack</small>
        </p>

        <hr>
        <a href="/user_app" class="btn btn-secondary">← Back to Dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
