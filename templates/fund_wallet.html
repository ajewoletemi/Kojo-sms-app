{% extends "base.html" %}
{% block title %}Fund with Card{% endblock %}
{% block content %}
<div class="nav">
    <a href="{{ url_for('dashboard') }}">← Back</a>
    <span class="balance-badge">BALANCE: ${{ "%.2f"|format(wallet) }}</span>
</div>

<h2 style="color:var(--yellow); margin-bottom:20px;">Fund Wallet with Card</h2>

<div class="card">
    <div style="background:#2a2200; border:1px solid var(--yellow); border-radius:10px; padding:12px; margin-bottom:20px; font-size:14px;">
        ⚠️ Minimum Funding: ₦15,000 = $10
    </div>

    <form method="POST">
        <label>Email Address</label>
        <input type="email" value="{{ current_user.email if current_user is defined else '' }}" disabled
               style="opacity:0.7;">

        <label>Amount (NGN)</label>
        <input type="number" name="amount" placeholder="Minimum ₦15000" min="15000" step="100" required>

        <p class="muted" style="margin-bottom:16px;">
            ₦1,500 = $1 → Your wallet will be credited in USD after payment.
        </p>

        <button type="submit" class="btn">Pay with Paystack</button>
    </form>
</div>
{% endblock %}
