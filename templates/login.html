<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kojo SMS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: #0a0a0a;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            color: #e0e0e0;
        }
       .container {
            background: #1a1a1a; padding: 40px; border-radius: 15px;
            border: 1px solid #333; box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
            width: 400px;
        }
        h2 { text-align: center; color: #FFD700; margin-bottom: 20px; letter-spacing: 1px; }
        input { 
            width: 100%; padding: 12px; margin: 10px 0; 
            background: #0f0f0f; border: 1px solid #333; border-radius: 8px; 
            color: #fff;
        }
        input:focus { border-color: #FFD700; outline: none; box-shadow: 0 0 8px rgba(255, 215, 0, 0.3); }
        button {
            width: 100%; padding: 12px; background: #FFD700; color: #000;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-top: 10px; transition: all 0.3s;
        }
        button:hover { 
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); 
            transform: translateY(-2px);
        }
       .flash { padding: 12px; margin-bottom: 15px; border-radius: 8px; font-size: 14px; }
      .success { background: rgba(0, 255, 0, 0.1); color: #4ade80; border: 1px solid #4ade80; }
      .danger { background: rgba(255, 0, 0, 0.1); color: #f87171; border: 1px solid #f87171; }
      .info { background: rgba(0, 150, 255, 0.1); color: #60a5fa; border: 1px solid #60a5fa; }
        p { text-align: center; margin-top: 15px; font-size: 14px; }
        a { color: #FFD700; text-decoration: none; font-weight: bold; }
        a:hover { text-shadow: 0 0 8px rgba(255, 215, 0, 0.5); }
    </style>
</head>
<body>
    <div class="container">
        <h2>WELCOME BACK</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}{% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}{% endif %}
        {% endwith %}
        <form method="POST">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">LOGIN</button>
        </form>
        <p>Don't have an account? <a href="{{ url_for('signup') }}">SIGN UP</a></p>
    </div>
</body>
</html>
