<!DOCTYPE html><html><head><title>Login - KOJO</title></head><body style="padding:30px;">
<h2>Login to KOJO</h2>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p style="color:red;">{{ message }}</p>{% endfor %}{% endwith %}
<form method="POST">
<input type="email" name="email" placeholder="Email" required style="padding:8px; width:300px;"><br><br>
<input type="password" name="password" placeholder="Password" required style="padding:8px; width:300px;"><br><br>
<button style="padding:10px 20px;">Login</button></form>
<p>Don't have account? <a href="/signup">Sign Up</a></p></body></html>
