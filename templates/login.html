<!DOCTYPE html><html><head><title>Login - KOJO</title>
<style>
body{background:#000; color:#fff; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
.box{background:#111; padding:40px; border-radius:10px; border:2px solid #0033cc; width:350px;}
h2{color:#FFD700; text-align:center;}
input{width:100%; padding:12px; margin:10px 0; background:#222; border:1px solid #0033cc; color:#fff; border-radius:5px;}
button{width:100%; padding:12px; background:#FFD700; color:#000; border:none; border-radius:5px; font-weight:bold; cursor:pointer;}
button:hover{background:#fff;}
a{color:#0033cc;}
</style></head><body>
<div class="box">
<h2>Login</h2>
{% with messages = get_flashed_messages() %}{% for message in messages %}<p style="color:red;">{{ message }}</p>{% endfor %}{% endwith %}
<form method="POST">
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>
<button>Login</button></form>
<p style="text-align:center;">No account? <a href="/signup">Sign Up</a></p>
</div></body></html>
