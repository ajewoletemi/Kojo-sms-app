{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-lg border-0">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h2 class="fw-bold text-primary">Kojo SMS</h2>
          <p class="text-muted">Login to your account</p>
        </div>

        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input name="username" type="text" class="form-control form-control-lg" placeholder="Enter username" required>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input name="password" type="password" class="form-control form-control-lg" placeholder="Enter password" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">Login</button>
          </div>
        </form>
        
        <p class="text-center text-muted mt-4 mb-0">
          <small>Demo: Use any username + password</small>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
