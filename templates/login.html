<!DOCTYPE html><html><head><title>Login - KOJO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:linear-gradient(135deg, #667eea, #764ba2); height:100vh; display:flex; justify-content:center; align-items:center; margin:0; font-family:'Segoe UI',Arial;}
.box{background:#fff; padding:40px; border-radius:20px; width:90%; max-width:400px; box-shadow:0 10px 40px rgba(0,0,0,0.3);}
h2{color:#4a5568; text-align:center; font-size:28px; margin-bottom:5px;}
.subtitle{text-align:center; color:#718096; margin-bottom:30px;}
input{width:100%; padding:14px; margin:10px 0; border:1px solid #e2e8f0; border-radius:10px; font-size:15px;}
button{width:100%; padding:15px; background:#4a90e2; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer;}
button:hover{background:#357ABD;}
a{color:#4a90e2; text-decoration:none;}
p{text-align:center; margin-top:15px; color:#718096;}
</style></head><body>
<div class="box">
<h2>KOJO SMS</h2>
<p class="subtitle">Login to your account</p>
{% with messages = get_flashed_messages() %}{% for message in messages %}<p style="color:red;">{{ message }}</p>{% endfor %}{% endwith %}
<form method="POST">
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>
<button>Login</button>
</form>
<p>No account? <a href="/signup">Signup</a></p>
</div></body></html>
