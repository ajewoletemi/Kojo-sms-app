<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOJO SMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { 
      background: #0a0a1a; 
      color: #fff; 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      text-align: center;
    }
    .kojo-title { 
      color: #FFD700; 
      text-shadow: 0 0 20px #FFD700, 0 0 40px #FFD700; 
      font-size: 3rem; font-weight: 800; margin-bottom: 10px;
    }
    .kojo-subtitle { color: #FFD700; font-size: 2rem; font-weight: 700; margin-top: 30px; margin-bottom: 10px; }
    .text-gray { color: #b0b0b0; }
    .btn-kojo { 
      background: #FFD700; border: none; color: #000; font-weight: bold; 
      padding: 12px 30px; border-radius: 12px; font-size: 16px; min-width: 140px;
    }
    .btn-kojo:hover { background: #ffea00; box-shadow: 0 0 20px #FFD700; color: #000; }
    .footer { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="kojo-title">KOJO SMS</h1>
    <p class="text-gray">Buy Virtual Numbers & Receive SMS Online</p>
    <h2 class="kojo-subtitle">Welcome</h2>
    <p class="text-gray">Get numbers from 20+ countries instantly</p>
    
    <div class="d-flex justify-content-center gap-3 mt-4">
      <a href="/register" class="btn btn-kojo">Get Started</a>
      <a href="/login" class="btn btn-kojo">Login</a>
    </div>

    <div class="footer">© 2026 KOJO SMS. All rights reserved.</div>
  </div>
</body>
</html>
