<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOJO - Compose SMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
        }
       .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            max-width: 700px;
            margin: 0 auto 30px auto;
        }
       .balance { background: #1a1a1a; padding: 10px 20px; border-radius: 10px; font-weight: 600; }
       .balance span { color: #00ff88; }
       .back-link { color: #FFD700; text-decoration: none; font-weight: 600; }
       .container { max-width: 700px; margin: 0 auto; }
        h1 { color: #FFD700; font-size: 24px; }
       .card {
            background: #121212;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #333;
        }
       .card h2 { color: #FFD700; margin-top: 0; }
        label { display:block; margin-top:15px; color:#aaa; }
        textarea {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
            box-sizing: border-box;
            font-family: 'Poppins';
        }
       .kojo-btn {
            background: #FFD700;
            color: #000;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
       .kojo-btn:hover { background: #ffea00; }
       .note { font-size: 12px; color: #aaa; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="{{ url_for('dashboard') }}" class="back-link">← Back to Dashboard</a>
        <div class="balance">BALANCE <span>₦{{ "%.2f"|format(balance) }}</span></div>
    </div>

    <div class="container">
        <h1>➤ Message Compose</h1>
        <p style="color:#aaa;">Compose and send supported messages.</p>

        <div class="card">
            <h2>Compose SMS</h2>
            <form method="POST" action="/send_sms">
                <label>Recipient numbers</label>
                <textarea name="numbers" rows="5" placeholder="+1234567890
+2348012345678" required></textarea>
                <small class="note">Paste multiple numbers, one per line. Use international format e.g +1, +44, +234</small>
                
                <label>Message</label>
                <textarea name="message" rows="4" placeholder="Type your message here..." required></textarea>
                
                <small class="note">Note: For best delivery, avoid spam words and links</small>
                <br><br>
                <button type="submit" class="kojo-btn">Send</button>
            </form>
        </div>
    </div>
</body>
</html>
