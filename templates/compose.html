<!DOCTYPE html><html><head><title>Send SMS - KOJO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>*{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial;}body{background:linear-gradient(135deg, #0a0a1a, #1a1a2e); color:#fff; min-height:100vh; padding:20px;}.topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;}.back{background:#1e1e3a; color:#FFD700; border:1px solid #2a2a4a; padding:10px 15px; border-radius:8px; text-decoration:none; font-weight:bold;}.balance-box{background:#1e1e3a; padding:10px 20px; border-radius:10px; border:1px solid #333; font-weight:bold;}h1{color:#FFD700; text-align:center; margin-bottom:10px; font-size:28px;}.card{background:rgba(30,30,58,0.8); backdrop-filter:blur(15px); padding:30px; border-radius:15px; border:2px solid #2a2a4a; max-width:600px; margin:20px auto; box-shadow:0 0 30px rgba(255,215,0,0.1);}label{display:block; color:#aaa; margin:15px 0 8px; font-weight:600;}textarea, input{width:100%; padding:14px; background:#0a0a1a; border:1px solid #2a2a4a; color:#fff; border-radius:8px; font-size:15px; outline:none;}textarea:focus, input:focus{border-color:#FFD700;}textarea{resize:vertical; min-height:120px;}.btn{width:100%; background:#FFD700; color:#000; padding:15px; border:none; border-radius:8px; font-weight:bold; font-size:16px; margin-top:20px; cursor:pointer; transition:0.3s;}.btn:hover{box-shadow:0 0 20px #FFD700;}.pricing{background:rgba(255,215,0,0.1); border:1px solid #FFD700; padding:15px; border-radius:8px; margin-bottom:20px; text-align:center; color:#FFD700; font-size:15px;}small{color:#888;}</style></head><body>
<div class="topbar"><a href="/dashboard" class="back">← Back</a><div class="balance-box">BALANCE: <b>${{ "%.2f"|format(balance) }}</b></div></div>
<h1>Send SMS</h1>
<div class="card">
<div class="pricing">💰 Cost: <b>$0.20 per SMS</b>. Put each number on a new line.</div>
<form action="/send_sms" method="POST">
<label>To Numbers</label>
<textarea name="to_number" placeholder="+2348012345678
+2348098765432
+447912345678" required></textarea>
<small>Example: 1 number per line</small>
<label>Message</label>
<textarea name="message" placeholder="Your message here..." required></textarea>
<button class="btn">Send SMS</button>
</form>
{% with messages = get_flashed_messages() %}{% for message in messages %}<p style="color:#00FF88; text-align:center; margin-top:15px;">{{ message }}</p>{% endfor %}{% endwith %}
</div></body></html>
