<!DOCTYPE html><html><head><title>Send SMS - KOJO</title>
<style>
body{background:#000; color:#fff; font-family:Arial; margin:0;}
.navbar{background:#0033cc; padding:15px; display:flex; justify-content:space-between;}
.navbar a{color:#FFD700; text-decoration:none; font-weight:bold; margin-left:15px;}
.container{padding:30px; max-width:600px; margin:auto;}
.box{background:#111; padding:30px; border-radius:10px; border:2px solid #0033cc;}
h2{color:#FFD700;}
label{display:block; margin-top:15px; color:#FFD700;}
input, textarea, select{width:100%; padding:12px; margin:8px 0; background:#222; border:1px solid #0033cc; color:#fff; border-radius:5px;}
button{width:100%; padding:14px; background:#FFD700; color:#000; border:none; border-radius:5px; font-weight:bold; cursor:pointer; margin-top:15px;}
button:hover{background:#fff;}
</style></head><body>
<div class="navbar">
<span style="color:#FFD700;">KOJO SMS</span>
<div>
<a href="/dashboard">Dashboard</a>
<a href="/logout">Logout</a>
</div>
</div>

<div class="container">
<div class="box">
<h2>Send SMS</h2>
{% with messages = get_flashed_messages() %}{% for message in messages %}<p style="color:#FFD700;">{{ message }}</p>{% endfor %}{% endwith %}

<form method="POST" action="/send_sms">
<label>From Number</label>
<select name="from_number" required>
<option value="">Select a Number</option>
<!-- You can loop your bought numbers here later -->
</select>

<label>To Number</label>
<input type="text" name="to_number" placeholder="+2348012345678" required>

<label>Message</label>
<textarea name="message" rows="5" placeholder="Type your message here..." required></textarea>

<button>Send SMS</button>
</form>
</div>
</div></body></html>
