{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Send SMS</h2>
  <p>Wallet Balance: $<strong>{{ wallet }}</strong></p>
  <p>Cost: $0.20 per SMS</p>

  <form method="POST">
    <div class="mb-3">
      <label>From Number</label>
      <input type="text" class="form-control" value="+17372508034" disabled>
    </div>
    <div class="mb-3">
      <label>Numbers - One per line</label>
      <textarea name="numbers" class="form-control" rows="5" placeholder="+2348012345678" required></textarea>
    </div>
    <div class="mb-3">
      <label>Message</label>
      <textarea name="message" class="form-control" rows="4" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Send SMS</button>
  </form>
</div>
{% endblock %}
