{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <a href="/user_app" class="btn btn-outline-warning">← Back</a>
  <span class="badge bg-dark p-2">BALANCE: ${{ "%.2f"|format(wallet) }}</span>
</div>
<div class="card">
  <div class="card-body">
    <h2 class="text-center kojo-yellow mb-3">Send SMS</h2>
    <div class="alert border-warning" style="background: rgba(255,215,0,0.1);">
      💰 Cost: <b>$0.20 per SMS</b>. Put each number on a new line.
    </div>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">To Numbers</label>
        <textarea name="numbers" class="form-control bg-dark text-white" rows="4" placeholder="+2348012345678
+2348098765432
+447912345678"></textarea>
        <small class="text-muted">Example: 1 number per line</small>
      </div>
      <div class="mb-3">
        <label class="form-label">Message</label>
        <textarea name="message" class="form-control bg-dark text-white" rows="4" placeholder="Your message here..."></textarea>
      </div>
      <button type="submit" class="btn btn-warning w-100 btn-lg">Send SMS</button>
    </form>
  </div>
</div>
{% endblock %}
