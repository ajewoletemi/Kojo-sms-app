{% extends "base.html" %}
{% block title %}Send SMS{% endblock %}
{% block content %}
<div class="nav">
    <a href="{{ url_for('dashboard') }}">← Back</a>
    <span class="balance-badge">BALANCE: ${{ "%.2f"|format(wallet) }}</span>
</div>

<h2 style="color:var(--yellow); margin-bottom:20px;">Send SMS</h2>

<div class="card">
    <div style="background:#2a2200; border:1px solid var(--yellow); border-radius:10px; padding:12px; margin-bottom:20px; font-size:14px;">
        💰 Cost: ${{ cost_per_sms }} per SMS. Put each number on a new line.
    </div>

    <form method="POST">
        <label>From Number</label>
        <select name="from_number">
            {% if numbers %}
                {% for n in numbers %}
                    <option value="{{ n.phone_number }}">{{ n.phone_number }}</option>
                {% endfor %}
            {% else %}
                <option value="">Using default Twilio number</option>
            {% endif %}
        </select>

        <label>To Numbers</label>
        <textarea name="recipients" rows="5" placeholder="+2348012345678&#10;+447911234567&#10;+1234567890" required>{{ to_prefill }}</textarea>
        <p class="muted" style="margin-top:-8px; margin-bottom:16px;">Example: 1 number per line (international format)</p>

        <label>Message</label>
        <textarea name="message" rows="4" placeholder="Your message here..." required></textarea>

        <button type="submit" class="btn">Send SMS</button>
    </form>
</div>
{% endblock %}
