<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Send SMS - Kojo</title>
    <style>
        body { background: #0D0B1E; color: #e0e0e0; font-family: Segoe UI; padding: 20px; }
   .card { background: #1A1733; padding: 30px; border-radius: 20px; max-width: 600px; margin: 50px auto; border: 1px solid #2A2744; }
        h2 { color: #FFD700; margin-bottom: 10px; }
        p { color: #A0A0C0; margin-bottom: 20px; }
        label { font-weight: 700; display: block; margin-bottom: 8px; }
        textarea { width: 100%; background: #0D0B1E; border: 1px solid #2A2744; color: #fff; padding: 12px; border-radius: 10px; margin-bottom: 15px; font-size: 15px; }
  .btn-send { background: #FFD700; color: #000; border: none; padding: 16px; border-radius: 12px; font-weight: 900; font-size: 16px; width: 100%; cursor: pointer; }
        a { color: #FFD700; text-decoration: none; display: block; text-align: center; margin-top: 15px; }
      .flash { padding: 12px; margin-bottom: 15px; border-radius: 8px; text-align: center; font-weight: 600; }
      .success { background: rgba(0, 255, 0, 0.1); color: #4ade80; }
      .danger { background: rgba(255, 0, 0, 0.1); color: #f87171; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Send SMS</h2>
        <p>Balance: ${{ "%.2f"|format(wallet) }} | Cost: $0.20 per SMS</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}{% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}{% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('send_sms_action') }}">
            <label>Recipients (one per line)</label>
            <textarea name="numbers" rows="5" placeholder="+2348012345678&#10;+2348098765432" required></textarea>
            
            <label>Message</label>
            <textarea name="message" rows="6" placeholder="Type your message here..." required></textarea>
            
            <button type="submit" class="btn-send">Send SMS</button>
        </form>
        <a href="{{ url_for('user_app') }}">← Back to Dashboard</a>
    </div>
</body>
</html>
