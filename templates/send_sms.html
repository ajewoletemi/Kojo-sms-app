{% extends "base.html" %}
{% block content %}
<div class="card shadow-lg">
  <div class="card-body p-4">
    <h2 class="card-title mb-3" style="color: var(--kojo-yellow);">Send SMS</h2>
    <p>Wallet Balance: <strong>${{ "%.2f"|format(wallet) }}</strong></p>
    <p class="text-muted">Cost: <strong>$0.20</strong> per SMS</p>
    
    <form method="post">
      <div class="mb-3">
        <label class="form-label">From Number</label>
        <input name="from_number" class="form-control" value="+17372508034">
      </div>
      <div class="mb-3">
        <label class="form-label">Numbers - One per line</label>
        <textarea name="numbers" class="form-control" rows="5" placeholder="+2348012345678  Nigeria
+233244123456  Ghana
+254712345678  Kenya"></textarea>
        <small class="text-muted">Must include country code. Ex: +234, +233, +254, +1, +44</small>
      </div>
      <div class="mb-3">
        <label class="form-label">Message</label>
        <textarea name="message" class="form-control" rows="4" placeholder="Type your message here..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100">Send SMS</button>
    </form>
  </div>
</div>
{% endblock %}
